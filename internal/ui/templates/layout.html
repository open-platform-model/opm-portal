{{define "layout" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"historyCacheSize":0,"refreshOnHistoryMiss":true,"selfRequestsOnly":true,"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
<title>{{.Title}} · OPM Portal</title>
<link rel="canonical" href="{{.Canonical}}">
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/portal.css">
<script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
<script src="/static/vendor/htmx-ext-sse-2.2.4.min.js" defer></script>
<script src="/static/portal.js" defer></script>
</head>
<body hx-ext="sse" sse-connect="{{.StreamURL}}?topics={{join .Topics ","}}" data-stream-base="{{.StreamURL}}" data-opened-topics="{{join .Topics " "}}">
<div id="stream-events" hidden hx-trigger="sse:open, sse:snapshot, sse:upsert, sse:delete, sse:k8sevent, sse:log, sse:logend, sse:closed"></div>
<a class="skip" href="#main">Skip to content</a>
<div id="app" hx-boost="true" hx-target="#main" hx-select="#main" hx-swap="outerHTML show:window:top">
<header class="masthead">
  <a class="brand" href="/" aria-label="OPM Portal, Platform">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 8 L16 2 L28 8 L28 24 L16 30 L4 24 Z"/><path class="brand-cut" d="M10 11 L16 8 L22 11 L22 21 L16 24 L10 21 Z"/></svg>
    <span class="brand-word">OPM<span class="brand-sub">portal</span></span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="/" {{if eq .Nav "platform"}}aria-current="page"{{end}}>Platform</a>
    <a href="/instances" {{if eq .Nav "instances"}}aria-current="page"{{end}}>Instances</a>
    <a href="/packages" {{if eq .Nav "packages"}}aria-current="page"{{end}}>Packages</a>
  </nav>
  <p class="live" id="live" role="status" aria-live="polite"><span class="live-dot" aria-hidden="true"></span><span class="live-text">not live</span></p>
</header>
<main id="main" tabindex="-1" data-topics="{{join .Topics " "}}" data-canonical="{{.Canonical}}">
{{template "content" .}}
</main>
</div>
<footer class="foot">
  <p>Read-only. Every page is read through the portal's <a href="/api/v1alpha1/clusters/default/platform">read API</a> as your kubeconfig's user.</p>
</footer>
</body>
</html>
{{- end}}
