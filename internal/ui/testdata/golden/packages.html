<main id="main" tabindex="-1" data-topics="" data-canonical="/packages">
<header class="page-head reveal">
  <p class="kicker">Module packages</p>
  <h1>Packages</h1>
  <p class="lede">Packages apply a module from a Flux source. Applied and Health are shown apart, as for instances.</p>
</header>
<form class="filter" method="get" action="/packages" role="search">
  <label for="namespace">Namespace</label>
  <input id="namespace" name="namespace" value="" list="namespaces" placeholder="all namespaces" autocomplete="off" spellcheck="false">
  <datalist id="namespaces"><option value="pkg"></datalist>
  <button type="submit">Filter</button>
</form>
<section class="panel panel-wide reveal" id="list" aria-label="Packages">
<div class="table-wrap">
<table class="table rows">
  <thead><tr><th scope="col">Package</th><th scope="col">Applied</th><th scope="col">Health</th><th scope="col">Source</th><th scope="col">Objects</th><th scope="col">Last applied</th></tr></thead>
  <tbody>
  <tr>
    <th scope="row" data-label="Package"><a href="/packages/pkg/podinfo"><span class="ns">pkg/</span>podinfo</a></th>
    <td data-label="Applied"><span class="applied applied-failed"><span class="axis">Applied axis</span>Failed, retrying</span></td>
    <td data-label="Health"><span class="health health-unknown"><span class="dot" aria-hidden="true"></span><span class="axis">Health axis</span>Unknown (not live)</span></td>
    <td data-label="Source"><span class="mono">OCIRepository podinfo-release</span></td>
    <td data-label="Objects" class="num">0</td>
    <td data-label="Last applied"><span class="muted">never</span></td>
  </tr>
  </tbody>
</table>
</div>
</section>
</main>
