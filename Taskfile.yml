version: "3"

# Silent by default - set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  BINARY_NAME: opm-portal
  BUILD_DIR: bin
  # Kept in lockstep with the openspec install in .github/workflows/lint.yml.
  OPENSPEC_VERSION: 1.12.0
  # Kept in lockstep with the oasdiff install in .github/workflows/lint.yml.
  OASDIFF_VERSION: v1.33.0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  #########################
  ## Build tasks
  #########################
  build:
    desc: Build the portal binary into bin/opm-portal
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} ./cmd/opm-portal
    sources:
      - "**/*.go"
      - go.mod
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  run:
    desc: 'Run the portal from source (task run -- serve --open runs local mode)'
    cmds:
      - go run ./cmd/opm-portal {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} dist
      - rm -f coverage.out coverage.html

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  #########################
  ## Code quality tasks
  #########################
  fmt:
    desc: Format code (gofmt and goimports, through golangci-lint's formatters)
    cmds:
      - go fmt ./...
      - golangci-lint fmt ./...

  vet:
    desc: Run go vet, including the e2e- and browser-tagged tests the nightly run builds
    cmds:
      - go vet ./...
      - go vet -tags e2e,browser ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint and apply its fixes
    cmds:
      - golangci-lint run --fix ./...

  test:
    desc: Run all tests under the race detector
    cmds:
      - go test -race ./...

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test:browser:
    desc: 'In Chromium, Firefox and WebKit, launch a local session from the --open page and the printed link, keep a tailed log pane through refreshes, and keep the theme and remembered filters, drive the graph, keep every F1 page within 360 px wide, and drive the info tip (dismiss, hover, tap) (Playwright image; OPM_PORTAL_CONTAINER_ENGINE=podman|docker)'
    env:
      OPM_PORTAL_CONTAINER_ENGINE: '{{.OPM_PORTAL_CONTAINER_ENGINE}}'
    cmds:
      - go test -tags browser -count=1 -run '^TestBrowser(Launch|Logs|Expired|Theme|Graph|Phone|Tip)$' -v ./cmd/opm-portal

  #########################
  ## e2e fixture cluster (test/e2e)
  #########################
  e2e:up:
    desc: 'Create the throwaway kind cluster opm-portal-e2e with the released operator and fixture set F1 (E2E_PROVIDER=podman|docker)'
    env:
      E2E_PROVIDER: '{{.E2E_PROVIDER}}'
      E2E_CLUSTER: '{{.E2E_CLUSTER}}'
    cmds:
      - test/e2e/up.sh

  e2e:down:
    desc: Delete the kind cluster opm-portal-e2e (with the provider e2e:up recorded, unless E2E_PROVIDER is set)
    env:
      E2E_PROVIDER: '{{.E2E_PROVIDER}}'
      E2E_CLUSTER: '{{.E2E_CLUSTER}}'
    cmds:
      - test/e2e/down.sh

  e2e:local:
    desc: Run the opm-portal binary in local mode against the fixture cluster and read through it (needs e2e:up)
    env:
      E2E_PROVIDER: '{{.E2E_PROVIDER}}'
      E2E_CLUSTER: '{{.E2E_CLUSTER}}'
    cmds:
      - test/e2e/local.sh

  e2e:m1:
    desc: Check the milestone 1 reads end to end on the fixture cluster, including a scripted image break it reverts (needs e2e:up)
    env:
      E2E_PROVIDER: '{{.E2E_PROVIDER}}'
      E2E_CLUSTER: '{{.E2E_CLUSTER}}'
    cmds:
      - test/e2e/m1.sh

  e2e:pod:
    desc: Build the portal image, run it in the fixture cluster from deploy/, and read through kubectl port-forward (needs e2e:up)
    env:
      E2E_PROVIDER: '{{.E2E_PROVIDER}}'
      E2E_CLUSTER: '{{.E2E_CLUSTER}}'
    cmds:
      - test/e2e/pod.sh

  e2e:dump:
    desc: 'Dump the fixture cluster''s OPM objects, Pods, events and operator log for a failed run, without Secrets or values (DIR=<directory>, default .e2e/dump/<cluster>)'
    env:
      E2E_PROVIDER: '{{.E2E_PROVIDER}}'
      E2E_CLUSTER: '{{.E2E_CLUSTER}}'
    cmds:
      - test/e2e/dump.sh {{if .DIR}}"{{.DIR}}"{{end}}

  e2e:capture:
    desc: Snapshot the opm-portal-e2e cluster into testdata/clusters/f1 (no Secrets, no values)
    env:
      E2E_PROVIDER: '{{.E2E_PROVIDER}}'
      E2E_CLUSTER: '{{.E2E_CLUSTER}}'
    cmds:
      - test/e2e/capture.sh

  e2e:capture:check:
    desc: Refuse any file under testdata/clusters that holds a Secret, managedFields, the last-applied annotation or spec.values, or does not parse
    cmds:
      - test/e2e/check-capture_test.sh
      - test/e2e/check-capture.sh

  #########################
  ## OpenSpec tasks
  #########################
  openspec:install:
    desc: Install the openspec CLI at the version CI pins
    cmds:
      - npm install -g @fission-ai/openspec@{{.OPENSPEC_VERSION}}

  openspec:check:
    desc: Validate every main spec and active change under openspec strict mode
    preconditions:
      - sh: command -v openspec >/dev/null
        msg: "openspec not found: run `task openspec:install` (needs npm)"
    cmds:
      - openspec validate --all --strict --no-interactive

  #########################
  ## Read API contract
  #########################
  api:install-oasdiff:
    desc: Install the oasdiff version CI pins
    cmds:
      - go install github.com/oasdiff/oasdiff@{{.OASDIFF_VERSION}}

  api:breaking:
    desc: 'Fail on a breaking change to openapi/v1alpha1.yaml against BASE (default origin/main) unless PR_TITLE carries "!"'
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    preconditions:
      - sh: command -v oasdiff >/dev/null
        msg: "oasdiff not found: run `task api:install-oasdiff`"
    cmds:
      - hack/api-breaking.sh {{.BASE}}

  #########################
  ## Docs bundle
  #########################
  # docs-kit.cue declares one docs bundle, opm-portal: the authored pages under
  # docs/site/. CI builds, signs and publishes it through docs-kit's
  # publish.yml (docs.yml, release.yml). These tasks run the same opm-docs
  # release locally, installed into .bin/. The release is pinned in
  # .opm-docs-version and in every publish.yml ref, and docs:pins:check
  # refuses the two disagreeing.

  tools:opm-docs:
    desc: Install or reuse .bin/opm-docs, the checksum-verified docs-kit release named by .opm-docs-version
    cmds:
      - bash .tasks/opm-docs.sh install

  docs:bundle:
    desc: Build the opm-portal docs bundle of the work tree into out/opm-portal/ (a local preview of edge)
    deps: [tools:opm-docs]
    cmds:
      - .bin/opm-docs build --project opm-portal --out out

  docs:pins:check:
    desc: Refuse a docs-kit publish.yml ref under .github/workflows/ that names another release than .opm-docs-version (offline)
    cmds:
      - bash .tasks/opm-docs.sh pin-check

  docs:bundle:check:
    desc: Check the docs-kit pins agree, then build and lint the opm-portal docs bundle into a temporary directory
    deps: [tools:opm-docs]
    cmds:
      - task: docs:pins:check
      - .bin/opm-docs check --project opm-portal

  #########################
  ## Release tasks
  #########################
  deps:release-check:
    desc: 'Release-pin gate G1 (workspace RELEASING.md, "Gates"): fail on a go.mod replace, or a pseudo-version or untagged OPM Go pin'
    cmds:
      - hack/release-pin-check.sh

  check:
    desc: Run all checks (fmt, vet, lint, openspec, test, committed captures)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: openspec:check
      - task: test
      - task: e2e:capture:check
