version: "3"

# Silent by default - set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  BINARY_NAME: opm-portal
  BUILD_DIR: bin
  # Kept in lockstep with the openspec install in .github/workflows/lint.yml.
  OPENSPEC_VERSION: 1.12.0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  #########################
  ## Build tasks
  #########################
  build:
    desc: Build the portal binary into bin/opm-portal
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} ./cmd/opm-portal
    sources:
      - "**/*.go"
      - go.mod
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  run:
    desc: Run the portal from source (today it prints its version)
    cmds:
      - go run ./cmd/opm-portal {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} dist
      - rm -f coverage.out coverage.html

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  #########################
  ## Code quality tasks
  #########################
  fmt:
    desc: Format code (gofmt and goimports, through golangci-lint's formatters)
    cmds:
      - go fmt ./...
      - golangci-lint fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint and apply its fixes
    cmds:
      - golangci-lint run --fix ./...

  test:
    desc: Run all tests under the race detector
    cmds:
      - go test -race ./...

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  #########################
  ## OpenSpec tasks
  #########################
  openspec:install:
    desc: Install the openspec CLI at the version CI pins
    cmds:
      - npm install -g @fission-ai/openspec@{{.OPENSPEC_VERSION}}

  openspec:check:
    desc: Validate every main spec and active change under openspec strict mode
    preconditions:
      - sh: command -v openspec >/dev/null
        msg: "openspec not found: run `task openspec:install` (needs npm)"
    cmds:
      - openspec validate --all --strict --no-interactive

  #########################
  ## Release tasks
  #########################
  deps:release-check:
    desc: 'Release-pin gate G1 (workspace RELEASING.md, "Gates"): fail on a go.mod replace, or a pseudo-version or untagged OPM Go pin'
    cmds:
      - hack/release-pin-check.sh

  check:
    desc: Run all checks (fmt, vet, lint, openspec, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: openspec:check
      - task: test
