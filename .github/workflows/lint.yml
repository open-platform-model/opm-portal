name: Lint

on:
  push:
    branches: [main]
  pull_request:
    # edited: the API gate reads the title, so a title fixed to carry "!"
    # runs the check again.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Must stay unique across this repo's jobs: the main ruleset requires the
    # check "Lint" (workspace RELEASING.md, "Rulesets on main") because it
    # carries the release-pin gate (G1) and the OpenSpec validation. A gate in a
    # separate job would pass when that job is skipped.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Release-pin gate (G1, release PRs only)
        if: startsWith(github.head_ref || github.ref_name, 'release-please--')
        run: task deps:release-check

      # .opm-docs-version and every docs-kit publish.yml ref under
      # .github/workflows/ name one docs-kit release (docs-kit C5, C12).
      # Offline: no opm-docs install.
      - name: docs-kit pins agree
        run: task docs:pins:check

      # Main specs and active changes validate under --strict from day one.
      # The version moves with OPENSPEC_VERSION in Taskfile.yml.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.14.1

      - name: OpenSpec (strict)
        run: task openspec:check

      # The read API changes only additively within v1alpha1: a breaking change
      # to the OpenAPI document fails here unless the PR title marks it with
      # "!". The title reaches the script through the environment, never the
      # shell text. The version moves with OASDIFF_VERSION in Taskfile.yml.
      - name: API breaking-change gate (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          go install github.com/oasdiff/oasdiff@v1.33.0
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          hack/api-breaking.sh FETCH_HEAD

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout=5m
          # The cli saw a run restored whole from the action's cache report
          # //nolint directives as unused that a full analysis uses, so lint
          # runs uncached.
          skip-cache: true
