name: Release

# release-please (as the opm-release-please App) creates the release tag and a
# draft GitHub Release. Two jobs then attach the release's artifacts: the
# binaries job (goreleaser: four archives and checksums.txt on the draft) and
# the image-release job (ghcr.io/open-platform-model/opm-portal, signed, with
# an SBOM and provenance). publish-release publishes the draft only after both
# succeeded. Release tags are immutable: nothing here moves, deletes or
# re-creates a tag, and a published release is never changed.
#
# Recovery: a failed run leaves a draft; finish it with "Re-run failed jobs",
# never "Re-run all jobs" (that re-runs release-please, which skips every
# downstream job and strands the draft). A published release that is wrong is
# fixed by releasing the next version.

on:
  push:
    branches:
      - main

# release-please acts through the App token, never GITHUB_TOKEN, so the
# workflow default is read-only; each later job declares what it needs.
permissions:
  contents: read

# One release run at a time. Draft releases defeat release-please's duplicate
# guard (GitHub accepts several drafts for one tag), and two image jobs could
# both find the version tag absent. A queued run is never cancelled mid-flight;
# GitHub replaces an older pending run, which is safe because release-please
# derives its state from the branch head and the release PR labels.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: open-platform-model/opm-portal

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # The only job that reads RELEASE_APP_PRIVATE_KEY. The release environment
    # admits main only, so a workflow run on any other branch cannot read the
    # key once it lives there.
    environment: release
    # release-please acts through the App token; GITHUB_TOKEN is unused.
    permissions: {}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own, and only the App may create a tag.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The token is this job's only credential: scope it to what
          # release-please uses (commits, release PRs, labels), never the
          # installation's full grant.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Build and attach release binaries
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The draft check needs write: GitHub hides draft releases from
      # read-only tokens.
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: .github/scripts/release-guard.sh assert-draft "${TAG}"

      # No cache: a release binary never builds on a cache another run, on
      # any branch, could have written.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # goreleaser attaches the archives and checksums.txt to the existing
      # draft and leaves it a draft (.goreleaser.yml); publish-release
      # publishes it.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact pin, as in the cli: the draft match by name is
          # version-specific; bump only with a release run that proves it.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-release:
    name: Build and publish release image
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag always names the image first pushed under it.
      # absent: build and push. reuse: a previous attempt of this release
      # already pushed it from the release commit, so push nothing under it and
      # reuse its digest. Anything else fails here.
      - name: Probe the release version tag
        id: probe
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
        run: |
          if ! out=$(.github/scripts/image-tag-guard.sh probe "${REF}" "$(git rev-parse HEAD)"); then
            echo "${out}"
            exit 1
          fi
          echo "${out}"
          echo "${out}" >> "${GITHUB_OUTPUT}"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Read the SHA from the checked-out tag, not the pushed commit, so the
          # revision label and sha-<short> name the release commit.
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      # No QEMU: the Dockerfile's builder runs on the build platform and
      # cross-compiles, and the final stage has no RUN step. No cache-from or
      # cache-to: a release image never builds on a cache another run could
      # have written.
      - name: Build and push image
        id: build
        if: steps.probe.outputs.state == 'absent'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resolve the release image digest
        id: digest
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          REUSED: ${{ steps.probe.outputs.digest }}
        run: |
          digest="${BUILT:-${REUSED}}"
          case "${digest}" in
          sha256:*) echo "digest=${digest}" >> "${GITHUB_OUTPUT}" ;;
          *) echo "::error::no release image digest (built '${BUILT}', reused '${REUSED}')"; exit 1 ;;
          esac

      - name: Verify the version tag names the pushed image
        if: steps.probe.outputs.state == 'absent'
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          .github/scripts/image-tag-guard.sh verify "${REF}" "${DIGEST}"

      # A cancelled first attempt may have pushed the version tag without the
      # mutable ones; point sha-<short> and latest at the reused digest.
      - name: Re-point the mutable tags to the reused image
        if: steps.probe.outputs.state == 'reuse'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
          DIGEST: ${{ steps.probe.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && [ "$tag" != "${VERSION_REF}" ] && args+=(-t "$tag")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.digest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && images+=("${tag}@${DIGEST}")
          done <<< "${TAGS}"
          cosign sign --yes "${images[@]}"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: ${{ github.workspace }}/sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Attest SBOM as cosign attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          SBOM_FILE: ${{ github.workspace }}/sbom.spdx.json
        run: |
          if [ ! -s "${SBOM_FILE}" ]; then
            echo "SBOM file ${SBOM_FILE} missing or empty" >&2
            exit 1
          fi
          cosign attest --yes \
            --predicate "${SBOM_FILE}" \
            --type spdxjson \
            "${IMAGE_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish the draft release
    # The single publish point: the release becomes public only after every
    # job that attaches an artifact has succeeded. A failed run leaves a
    # draft; recover with "Re-run failed jobs", never "Re-run all jobs".
    needs: [release-please, binaries, image-release]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Checkout the release guard at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          sparse-checkout: .github/scripts

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          .github/scripts/release-guard.sh publish "${TAG}"
