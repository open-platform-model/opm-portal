version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    ignore:
      # No docs-kit workflow yet; the publish-portal-docs change adds publish.yml.
      # It moves only with .opm-docs-version, after the site bumps (docs-kit C5, C12).
      - dependency-name: "open-platform-model/docs-kit*"
      # Nothing here references the org .github repository yet. When something
      # does, it moves by the .github pin procedure only (.github README
      # "Pinning and bumps"); a Dependabot bump would move one reference alone.
      - dependency-name: "open-platform-model/.github*"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # build is a hidden type here, so a Dependabot Go bump releases nothing as
      # titled. Retitle it fix(deps) only for a security fix the binaries and
      # image must ship (workspace RELEASING.md, "Dependabot PRs"); the squash
      # merge carries the PR title only. deps would release: it is a visible
      # section in release-please-config.json.
      prefix: "build"
      include: "scope"
    groups:
      # The Kubernetes stack moves in lockstep; bump it as one PR.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
    ignore:
      # OPM modules move by hand as a fix(deps) PR while this repo is a leaf
      # outside the release cascade (workspace RELEASING.md, "Pin classes").
      - dependency-name: "github.com/open-platform-model/*"
